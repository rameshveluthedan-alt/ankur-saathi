# Settings for Cloud Run. NO SECRETS here: the database password, the AI key and the session secret come from Secret Manager (DEPLOY.md, step 4).
# DEPLOY.md step 6 copies this file to cloudrun-env.generated.yaml, filling in the connection name. Check the two lines marked <<<.

DB_HOST: "/cloudsql/PROJECT:REGION:INSTANCE"     # filled in by step 6 from the Cloud SQL connection name
DB_PORT: "5432"
DB_USER: "ankur"
DB_NAME: "ankur_saathi"

# <<< These three MUST match your own backend/.env (DEPLOY.md step 6 prints the lines to copy). The app's built-in default for
# CLAUDE_MAX_TOKENS is 8000, and a plan needs about 13,000: with the default EVERY plan is cut off and fails, in the cloud only,
# because on your machine your .env already sets it.
CLAUDE_MODEL: "claude-sonnet-5-5"
CLAUDE_VISION_MODEL: "claude-sonnet-5-5"
CLAUDE_MAX_TOKENS: "24000"

AUTH_MODE: "enforce"
# how long a sign-in lasts: 7 days, so a teacher on her own phone rarely types her password (docs/AUTH.md). Accounts are made by the school leader or loaded by the department:
# nobody registers themselves.
SESSION_HOURS: "168"
SELF_REGISTRATION: "false"
DEBUG: "false"

# check-for-understanding show-me questions in every lesson (docs/CFU.md). "false" = plans exactly as before, with no redeploy of code:
#   gcloud run services update ankur-saathi --region=asia-south1 --update-env-vars=CFU_ENABLED=false
CFU_ENABLED: "true"
# when the model skips a block's questions (about 1 plan in 6 in the first real runs) or too many are rejected, the app asks it ONCE for just the missing ones (a second paid call, about 2 to 5 cents,
# checked against the AI limit and metered). "0" switches that extra call off:
#   gcloud run services update ankur-saathi --region=asia-south1 --update-env-vars=CFU_TOPUP=0
CFU_TOPUP: "1"
SEMANTIC_RETRIEVAL: "off"            # "on" = where the curated anchors have nothing for a skill, choose the anchor nearest in meaning (docs/SEMANTIC_RETRIEVAL.md). A redeploy REPLACES the variables with this file: keep the setting here.

# the hackathon credit (docs/AI_BUDGET.md). Prices: USD per million tokens, from the pricing page for your model.
AI_ENABLED: "true"
AI_ALLOCATION_USD: "500"
AI_SPEND_OFFSET_USD: "3"
AI_CREDIT_EXPIRES: "2026-11-20"
AI_RESERVE_USD: "250"
AI_RESERVE_FROM: "2026-11-01"
AI_FINAL_MARGIN_USD: "10"
AI_CAP_GLOBAL_DAILY_USD: "20"
AI_CAP_SCHOOL_DAILY_USD: "10"
AI_CAP_TEACHER_DAILY_USD: "3"
AI_CAP_SHARED_DEMO_DAILY_USD: "8"
AI_PRICE_INPUT_PER_MTOK: "2"
AI_PRICE_OUTPUT_PER_MTOK: "10"

# how often one network address may try (backend/app/rate_limit.py)
RATE_LOGIN_PER_MIN: "20"
RATE_REGISTER_PER_HOUR: "5"
RATE_CHANGE_PIN_PER_MIN: "10"
TRUSTED_PROXY_HOPS: "1"
